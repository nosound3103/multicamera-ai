model:
  weights: yolov8n.pt
  device: cpu
  confidence: 0.4
  imgsz: 640

  # COCO:
  # 0 = person
  # 2 = car
  # 3 = motorcycle
  # 5 = bus
  # 7 = truck
  class_ids: [0, 2, 3, 5, 7]

cameras:
  - id: cam1
    enabled: true

    source:
      type: rtsp
      uri: rtsp://mediamtx:8554/input_cam1

    output_url: rtsp://mediamtx:8554/output_cam1

    lines:
      - id: entrance
        start: { x: 0.1, y: 0.6 }
        end: { x: 0.9, y: 0.6 }

    zones:
      - id: restricted_area
        points:
          - { x: 0.2, y: 0.2 }
          - { x: 0.8, y: 0.2 }
          - { x: 0.8, y: 0.8 }
          - { x: 0.2, y: 0.8 }

  - id: cam2
    enabled: true

    source:
      type: rtsp
      uri: rtsp://mediamtx:8554/input_cam2

    output_url: rtsp://mediamtx:8554/output_cam2

    lines:
      - id: entrance
        start: { x: 0.1, y: 0.5 }
        end: { x: 0.9, y: 0.5 }

    zones: []

  - id: cam3
    enabled: true

    source:
      type: rtsp
      uri: rtsp://mediamtx:8554/input_cam3

    output_url: rtsp://mediamtx:8554/output_cam3

    lines: []

    zones:
      - id: parking_area
        points:
          - { x: 0.1, y: 0.1 }
          - { x: 0.6, y: 0.1 }
          - { x: 0.6, y: 0.7 }
          - { x: 0.1, y: 0.7 }

  - id: cam4
    enabled: true

    source:
      type: rtsp
      uri: rtsp://mediamtx:8554/input_cam4

    output_url: rtsp://mediamtx:8554/output_cam4

    lines: []
    zones: []
